<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>promptd - sign in</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1115'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23d97757'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">
        <span class="dot"></span>
        <span>promptd</span>
      </span>
    </header>
    <main class="login">
      <form id="login" class="card">
        <h1>Sign in</h1>
        <div id="error" class="error" hidden></div>
        <div class="field">
          <label for="password">Admin password</label>
          <input id="password" type="password" autocomplete="current-password" required autofocus />
        </div>
        <div class="form-actions">
          <button class="btn primary" type="submit">Sign in</button>
        </div>
        <div class="hint">Set or change it with <span class="mono">npm run set-password</span> on the hub's machine.</div>
      </form>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
